<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Helping Hands NGO</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-light">

  <!-- Main Login Container -->
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-lg-5 col-md-7">
        <!-- Login Card -->
        <div class="card shadow-lg border-0 rounded-lg">
          <!-- Card Header -->
          <div class="card-header bg-primary text-white text-center py-4">
            <h3 class="mb-0">
              <i class="fas fa-hands-helping me-2"></i>Helping Hands
            </h3>
            <p class="mb-0 mt-2">Welcome back! Please login to your account</p>
          </div>
          
          <!-- Card Body -->
          <div class="card-body p-5">
            <!-- Login Form -->
            <form id="loginForm" novalidate>
              <!-- Email Field -->
              <div class="mb-4">
                <label for="email" class="form-label fw-bold">
                  <i class="fas fa-envelope me-2 text-primary"></i>Email Address
                </label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="fas fa-user"></i>
                  </span>
                  <input 
                    type="email" 
                    class="form-control" 
                    id="email" 
                    placeholder="your@email.com"
                    required
                  >
                  <div class="invalid-feedback">
                    Please enter a valid email address
                  </div>
                </div>
              </div>
              
              <!-- Password Field -->
              <div class="mb-4">
                <label for="password" class="form-label fw-bold">
                  <i class="fas fa-lock me-2 text-primary"></i>Password
                </label>
                <div class="input-group">
                  <span class="input-group-text">
                    <i class="fas fa-key"></i>
                  </span>
                  <input 
                    type="password" 
                    class="form-control" 
                    id="password" 
                    placeholder="Enter password"
                    required
                    minlength="8"
                  >
                  <button 
                    class="btn btn-outline-secondary toggle-password" 
                    type="button"
                    data-target="#password"
                  >
                    <i class="fas fa-eye"></i>
                  </button>
                  <div class="invalid-feedback">
                    Password must be at least 8 characters
                  </div>
                </div>
              </div>
              
              <!-- Remember Me & Forgot Password -->
              <div class="d-flex justify-content-between mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe">
                  <label class="form-check-label" for="rememberMe">
                    Remember me
                  </label>
                </div>
                <a href="forgot-password.html" class="text-decoration-none">
                  Forgot password?
                </a>
              </div>
              
              <!-- Submit Button -->
              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg">
                  <i class="fas fa-sign-in-alt me-2"></i>Login
                </button>
              </div>
              
              <!-- Social Login -->
              <div class="text-center mb-4">
                <p class="text-muted mb-3">Or login with</p>
                <div class="d-flex justify-content-center gap-3">
                  <a href="#" class="btn btn-outline-primary rounded-circle social-btn">
                    <i class="fab fa-google"></i>
                  </a>
                  <a href="#" class="btn btn-outline-primary rounded-circle social-btn">
                    <i class="fab fa-facebook-f"></i>
                  </a>
                  <a href="#" class="btn btn-outline-primary rounded-circle social-btn">
                    <i class="fab fa-twitter"></i>
                  </a>
                </div>
              </div>
            </form>
          </div>
          
          <!-- Card Footer -->
          <div class="card-footer text-center py-3 bg-light">
            <p class="mb-0">
              Don't have an account? 
              <a href="signup.html" class="text-decoration-none fw-bold">
                Create one
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0">
        &copy; 2025 Helping Hands NGO. All Rights Reserved. | 
        <a href="#" class="text-white text-decoration-none">Privacy Policy</a> | 
        <a href="#" class="text-white text-decoration-none">Terms of Service</a>
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Toggle password visibility
    document.querySelectorAll('.toggle-password').forEach(button => {
      button.addEventListener('click', function() {
        const target = this.getAttribute('data-target');
        const input = document.querySelector(target);
        const icon = this.querySelector('i');
        
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      });
    });

    // Form validation
    (function() {
      'use strict';
      
      const form = document.getElementById('loginForm');
      
      form.addEventListener('submit', function(event) {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }
        
        form.classList.add('was-validated');
      }, false);
    })();
  </script>
</body>
</html>
